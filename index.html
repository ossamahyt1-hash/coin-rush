<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coin Rush 🎁</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #17172b, #30205c);
    color: white;
}

.game {
    width: 100%;
    max-width: 430px;
    background: #24243b;
    border-radius: 24px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.5);
}

h1 {
    margin: 5px 0 8px;
    font-size: 32px;
}

.subtitle {
    color: #bbbbbb;
    margin-bottom: 20px;
}

.coins {
    font-size: 42px;
    font-weight: bold;
    margin: 15px 0;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 16px;
    margin: 8px 0;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#clickBtn {
    background: #ffd43b;
    color: #241f00;
}

#rewardBtn {
    background: #7c5cff;
    color: white;
}

.shop {
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 18px;
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 12px;
    margin: 8px 0;
}

.buy {
    width: auto;
    margin: 0;
    padding: 10px 14px;
    background: #31d158;
    color: white;
}

.message {
    min-height: 24px;
    color: #8fffa8;
    margin-top: 8px;
}

.small {
    font-size: 12px;
    color: #999;
    margin-top: 18px;
    line-height: 1.4;
}

</style>
</head>

<body>

<div class="game">

<h1>Coin Rush 🎁</h1>

<div class="subtitle">
Clique, gagne des pièces et débloque des objets !
</div>

<div class="coins">
🪙 <span id="coins">0</span>
</div>

<button id="clickBtn">
🪙 Gagner 1 pièce
</button>

<button id="rewardBtn">
📺 Regarder une pub → +10 pièces
</button>

<div class="message" id="message"></div>

<div class="shop">

<h2>🛍️ Boutique</h2>

<div class="item">
<span>⭐ Badge VIP — 50 pièces</span>

<button class="buy"
data-cost="50"
data-name="Badge VIP">

Acheter

</button>
</div>

<div class="item">

<span>🚀 Fusée — 100 pièces</span>

<button class="buy"
data-cost="100"
data-name="Fusée">

Acheter

</button>

</div>

<div class="item">

<span>👑 Couronne — 250 pièces</span>

<button class="buy"
data-cost="250"
data-name="Couronne">

Acheter

</button>

</div>

</div>

<div class="small">

Démo : la publicité est actuellement simulée.

</div>

</div>

<script>

let coins =
Number(localStorage.getItem("coins") || 0);

const coinsElement =
document.getElementById("coins");

const message =
document.getElementById("message");

const clickButton =
document.getElementById("clickBtn");

const rewardButton =
document.getElementById("rewardBtn");


function saveCoins() {

localStorage.setItem("coins", coins);

coinsElement.textContent = coins;

}


function showMessage(text) {

message.textContent = text;

setTimeout(function() {

message.textContent = "";

}, 2000);

}


clickButton.onclick = function() {

coins += 1;

saveCoins();

showMessage("+1 pièce 🪙");

};


rewardButton.onclick = function() {

rewardButton.disabled = true;

let seconds = 5;

rewardButton.textContent =
"📺 Pub simulée (" + seconds + "s)";

const timer = setInterval(function() {

seconds--;

rewardButton.textContent =
"📺 Pub simulée (" + seconds + "s)";

if (seconds <= 0) {

clearInterval(timer);

coins += 10;

saveCoins();

showMessage("+10 pièces 🎉");

rewardButton.textContent =
"📺 Regarder une pub → +10 pièces";

rewardButton.disabled = false;

}

}, 1000);

};


document.querySelectorAll(".buy")
.forEach(function(button) {

button.onclick = function() {

const cost =
Number(button.dataset.cost);

const name =
button.dataset.name;

if (coins < cost) {

showMessage(
"Il te faut " +
(cost - coins) +
" pièce(s) de plus."
);

return;

}

coins -= cost;

saveCoins();

showMessage(
name + " débloqué ! 🎉"
);

};

});


saveCoins();

</script>

</body>
</html>
